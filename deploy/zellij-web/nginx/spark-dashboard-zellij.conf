map $http_upgrade $spark_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # Loopback-only by design. Reach this listener through an SSH tunnel or
    # replace it with a TLS-enabled, access-controlled listener.
    listen 127.0.0.1:3080;
    server_name _;

    location /zellij/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $spark_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 86400s;

        # Zellij deliberately returns DENY. This deployment embeds it only in
        # the same-origin dashboard, so narrow that policy to SAMEORIGIN.
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    location = /zellij {
        return 308 /zellij/;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $spark_connection_upgrade;
        proxy_read_timeout 86400s;
    }
}
